// Wear OS companion: complications + a small glanceable screen.
// Shares applicationId and signing with the phone app, as the Wearable Data Layer requires.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "harmonia.companion.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "harmonia.companion"
        minSdkVersion rootProject.ext.wearMinSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation project(':harmonia-core')
    implementation "androidx.core:core-ktx:$androidxCoreKtxVersion"
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.wear.compose:compose-material3:$wearComposeVersion"
    implementation "androidx.wear.compose:compose-foundation:$wearComposeVersion"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:$wearComplicationsVersion"
    implementation "androidx.wear:wear-remote-interactions:$wearRemoteInteractionsVersion"
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutinesVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:$junitVersion"
}
